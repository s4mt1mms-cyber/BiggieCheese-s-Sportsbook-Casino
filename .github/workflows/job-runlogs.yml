name: BiggieTown server logs (read-only)
on:
  workflow_dispatch: {}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Recent logs
        run: |
          gcloud logging read 'resource.type="cloud_run_revision" AND resource.labels.service_name="biggietown"' --project biggiecheesesportsbook --freshness=1d --limit 300 --format 'value(timestamp,severity,textPayload,httpRequest.status,httpRequest.requestUrl)' | head -300
          gcloud run services describe biggietown --region us-central1 --project biggiecheesesportsbook --format 'value(status.conditions,spec.template.metadata.annotations)'
