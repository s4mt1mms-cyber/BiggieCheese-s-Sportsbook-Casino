name: Admin fix (one-off data fixes)

on:
  workflow_dispatch:
    inputs:
      fix:
        description: "Fix name (see tools/jobs/admin_fix.py)"
        required: true
        type: string

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet google-cloud-firestore==2.19.0
      - name: Fix
        working-directory: tools/jobs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIX: ${{ inputs.fix }}
        run: python admin_fix.py "$FIX"
