name: Deploy Biggietown server
on:
  push:
    branches: [main]
    paths: ["server/**", ".github/workflows/deploy-biggietown.yml"]
  workflow_dispatch: {}
concurrency:
  group: deploy-biggietown
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Enable the APIs it needs (no-op once on)
        run: gcloud services enable run.googleapis.com cloudbuild.googleapis.com artifactregistry.googleapis.com --project biggiecheesesportsbook --quiet
      # One instance on purpose: every match lives in that instance's memory. WebSockets stay open up to 60 min (the page reconnects and resumes).
      - name: Deploy
        run: >
          gcloud run deploy biggietown --source server --region us-central1 --project biggiecheesesportsbook
          --allow-unauthenticated --max-instances 1 --min-instances 0 --timeout 3600 --session-affinity
          --memory 512Mi --cpu 1 --concurrency 250 --quiet
      - name: Check it answers
        run: curl -fsS "$(gcloud run services describe biggietown --region us-central1 --project biggiecheesesportsbook --format 'value(status.url)')/status"
