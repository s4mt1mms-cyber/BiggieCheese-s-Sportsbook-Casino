name: Economy snapshot (read-only)

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet google-cloud-firestore==2.19.0
      - name: Export
        working-directory: tools/jobs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python export_econ.py
      - uses: actions/upload-artifact@v4
        with:
          name: econ
          path: tools/jobs/export
          retention-days: 1
