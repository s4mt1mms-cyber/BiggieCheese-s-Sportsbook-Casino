# Deploys the Firestore security rules + indexes, the game server (Cloud
# Functions in functions/) and the site (Firebase Hosting) every time something
# is pushed to main.
#
# Needs one repository secret: FIREBASE_SERVICE_ACCOUNT
#   (created for you by `firebase init hosting:github`, or by hand — see README).
# The service account needs these roles in Google Cloud IAM:
#   Firebase Hosting Admin, Firebase Rules Admin, Cloud Datastore Index Admin,
#   API Keys Viewer, Service Account User.
# For the game server it also needs (README "Live tables on the server"):
#   Cloud Functions Admin, Cloud Run Admin, Cloud Build Editor, Artifact
#   Registry Administrator, Eventarc Admin, Cloud Scheduler Admin.
# The functions step is allowed to fail: the site still deploys, and the app
# keeps phones hosting the live tables until config/mp.serverHost is switched on.
name: Deploy to Firebase on merge

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  FIREBASE_PROJECT_ID: biggiecheesesportsbook

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Rules first: a site that expects new rules shouldn't go live before them.
      - name: Deploy Firestore rules and indexes
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@13 deploy \
            --only firestore:rules,firestore:indexes \
            --project "$FIREBASE_PROJECT_ID" \
            --non-interactive --force
          rm -f "$RUNNER_TEMP/sa.json"

      # The game server. Failing here (missing roles/APIs) must not stop the site
      # from deploying: phones keep hosting the tables until the server is on.
      - name: Install and test the game server
        id: fntest
        continue-on-error: true
        working-directory: functions
        run: |
          npm ci
          npm test

      - name: Deploy the game server (Cloud Functions)
        id: functions
        if: steps.fntest.outcome == 'success'
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          trap 'rm -f "$RUNNER_TEMP/sa.json"' EXIT
          npx --yes firebase-tools@13 deploy \
            --only functions \
            --project "$FIREBASE_PROJECT_ID" \
            --non-interactive --force

      - name: Game server not deployed (the site still deploys)
        if: steps.fntest.outcome != 'success' || steps.functions.outcome == 'failure'
        run: |
          echo "::warning title=Game server (Cloud Functions) not deployed::The live tables keep running on players' phones. Usual cause: the deploy service account is missing roles or Google Cloud APIs. See README > Live tables on the server > Turning it on. Leave config/mp.serverHost off until a functions deploy succeeds."

      # Stamp the build so open apps can tell a new version is out ("Update ready" banner).
      - name: Stamp build id
        run: |
          printf '%s' "$GITHUB_SHA" > public/version.txt
          sed -i "s/__APP_BUILD__/$GITHUB_SHA/" public/index.html

      - name: Deploy Hosting (live channel)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: ${{ env.FIREBASE_PROJECT_ID }}
