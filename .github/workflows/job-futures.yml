name: Futures odds (weekly)

on:
  schedule:
    - cron: "45 6 * * 2"   # Tuesdays 2:45 AM Eastern (6:45 UTC during EDT)
  workflow_dispatch: {}

concurrency:
  group: job-futures
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet google-cloud-firestore==2.19.0
      - name: Run futures job
        working-directory: tools/jobs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python futures.py
