name: Grade finished games (manual)

on:
  workflow_dispatch: {}
  # owner Oct 27: settle league matchups on their own at the Tuesday 12:01 AM ET reset (04:01 UTC in EDT, 05:01 UTC in EST),
  # then retry through Tuesday/Wednesday in case Monday night runs late (grade.py waits until every NFL game of the week is over)
  schedule:
    - cron: "1 4 * * 2"
    - cron: "1 5 * * 2"
    - cron: "15 6-23/2 * * 2"
    - cron: "15 */4 * * 3"

concurrency:
  group: job-grade
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet google-cloud-firestore==2.19.0
      - name: Run grade job
        working-directory: tools/jobs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python grade.py
