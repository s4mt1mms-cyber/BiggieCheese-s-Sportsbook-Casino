name: Daily money report

on:
  schedule:
    - cron: "20 5 * * *"   # ~1:20 AM EDT / 12:20 AM EST, after the 12:01 AM ET reset
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet google-cloud-firestore==2.19.0
      - name: Report
        working-directory: tools/jobs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python econ_daily.py
